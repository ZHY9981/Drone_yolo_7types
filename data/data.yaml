# aerial_v9 — Custom Aerial Detection Dataset
# ============================================
# Sources: curated from public aerial datasets
#   - aerial.v1i (CC BY 4.0)
#   - Aerial Vehicle Detection (MIT)
#   - aerial.v3i (MIT)
#
# 7 classes: person, cycle, bus, small-bus, car, truck, freight
#
# Note: dataset is ~10 GB and not open-sourced in this repo
# due to license terms. Contact the owner for access.
# If you already have the dataset locally, update 'path' below.

path: /path/to/aerial_v9    # ← update to your local path
train: train/images
val: valid/images
test: test/images

nc: 7
names:
  0: person
  1: cycle
  2: bus
  3: small-bus
  4: car
  5: truck
  6: freight
