# YOLO26s V18.1 — V18.0 + ASFF 双尺度空间融合
# ====================================================
# 改动 (vs V18.0):
#   1. P4 CoordAtt → ECA (继承V18.0)
#   2. P3/P4 检测头前各加 ASFFLevel 双尺度自适应融合
#      ASFF: 逐位置学习 P3/P4 的融合权重, 抑制跨尺度梯度冲突
#      论文: Liu et al. "Learning Spatial Fusion for SSD" arXiv 2019
#
# 继承V17: imgsz=800, batch=4, epochs=120, RepNCSPELAN4, TAL 4px

# Parameters
nc: 7
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10

head:
  # FPN: P5→P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                        # 12
  - [-1, 2, C3k2, [512, True]]                       # 13 (P4/16-FPN)

  # FPN: P4→P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 14
  - [[-1, 4], 1, Concat, [1]]                        # 15
  - [-1, 2, C3k2, [256, True]]                       # 16 (P3/8-small)
  - [-1, 1, CoordAtt, [32]]                          # 17 ⭐ P3 CoordAtt (保留)

  # PAN: P3→P4
  - [-1, 1, Conv, [256, 3, 2]]                       # 18
  - [[-1, 13], 1, Concat, [1]]                        # 19
  - [-1, 2, C3k2, [512, True]]                       # 20 (P4/16-medium)
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 1]]        # 21 P4 RepNCSPELAN4
  - [-1, 1, ECA, [256]]                               # 22 ⭐ P4 ECA

  # ASFF: 双尺度自适应空间融合
  - [[17, 22], 1, ASFFLevel, [128, 256, 0]]         # 23 ⭐ ASFF_P3 (P3+↑P4)
  - [[22, 17], 1, ASFFLevel, [256, 128, 1]]         # 24 ⭐ ASFF_P4 (P4+↓P3)

  # Detect
  - [[23, 24], 1, Detect, [nc]]                       # 25 P3+P4双头
