# YOLO26s V17 — V16 + P4 RepNCSPELAN4 + car weight 1.8
# ====================================================
# 改动 (vs V16):
#   1. P4 PAN 融合后新增 RepNCSPELAN4[256,128,64,1] — 强化P4特征表达
#   2. car cls_weight 1.6→1.8
#
# RepNCSPELAN4: YOLOv9/GELAN 构建块, 训练多分支→推理融合为单conv
# 原理: 通道split→双RepCSP分支→concat→1×1压缩, 零推理代价
#
# P3 完全不变, person/cycle 不受影响
# 继承V16: imgsz=800, TAL 4px, CoordAtt, WIoUv3, E2ELoss

# Parameters
nc: 7
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10

head:
  # FPN: P5→P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                        # 12
  - [-1, 2, C3k2, [512, True]]                       # 13 (P4/16-FPN)

  # FPN: P4→P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 14
  - [[-1, 4], 1, Concat, [1]]                        # 15
  - [-1, 2, C3k2, [256, True]]                       # 16 (P3/8-small)
  - [-1, 1, CoordAtt, [32]]                          # 17 P3 CoordAtt

  # PAN: P3→P4
  - [-1, 1, Conv, [256, 3, 2]]                       # 18
  - [[-1, 13], 1, Concat, [1]]                        # 19
  - [-1, 2, C3k2, [512, True]]                       # 20 (P4/16-medium)
  - [-1, 1, RepNCSPELAN4, [256, 128, 64, 1]]        # 21 ⭐ P4 RepNCSPELAN4
  - [-1, 1, CoordAtt, [32]]                          # 22 P4 CoordAtt

  # Detect
  - [[17, 22], 1, Detect, [nc]]                       # 23 P3+P4双头
