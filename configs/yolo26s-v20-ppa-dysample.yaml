# YOLO26s V20 — V16 + P5 256ch CoordAtt（干净的第三头）
# ====================================================
# 改动 (vs V16.0):
#   1. 新增 P5 256ch 检测头 (去掉之前 V20 的 DySample/PPA/C2f-DD)
#   2. P5 检测头前加 CoordAtt[32]
#
# 设计逻辑:
#   V16 (双头): 74.0% — person=60.2%, cycle=42.9%, car=67.3%
#   旧V20 (三头+PPA+DySample+C2f-DD): 73.21% — 被多个模块污染
#   新V20 用最干净的方式加 P5, 回答:
#   "P5 256ch+CoordAtt 能否在保留 person/cycle 前提下恢复 car?"
#
# 继承 V16:
#   - TAL stride=4px, class weight person×2/cycle×3 (在 loss.py 中)
#   - WIoU v3, scale=0.3, close_mosaic=10
#   - CoordAtt 在每检测头前独立放置
#   - nearest 上采样 (不用 DySample)

# Parameters
nc: 7
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone — 与 V16 完全相同
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10

# Head — V16 的 P3+P4 + 新增 P5 256ch 检测头
head:
  # --- FPN: P5→P4 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]]                    # 13 (P4/16-FPN)

  # --- FPN: P4→P3 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]]                    # 16 (P3/8-FPN)
  - [-1, 1, CoordAtt, [32]]                       # 17 ⭐ P3 CoordAtt

  # --- PAN: P3→P4 ---
  - [-1, 1, Conv, [256, 3, 2]]                    # 18
  - [[-1, 13], 1, Concat, [1]]                    # 19 cat FPN P4
  - [-1, 2, C3k2, [512, True]]                    # 20 (P4/16-PAN)
  - [-1, 1, CoordAtt, [32]]                       # 21 ⭐ P4 CoordAtt

  # --- NEW PAN: P4→P5 (256ch 完整版) ---
  - [-1, 1, Conv, [256, 3, 2]]                    # 22 P4→P5 down (512→256ch)
  - [[-1, 10], 1, Concat, [1]]                    # 23 concat backbone P5(1024ch)
  - [-1, 2, C3k2, [512, True]]                    # 24 (P5/32-PAN fusion)
  - [-1, 1, CoordAtt, [32]]                       # 25 ⭐ P5 CoordAtt

  # --- Detect — 三头 ---
  - [[17, 21, 25], 1, Detect, [nc]]               # 26 P3+P4+P5 三头
